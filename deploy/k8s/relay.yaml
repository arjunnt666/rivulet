apiVersion: apps/v1
kind: Deployment
metadata:
  name: rivulet-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rivulet-relay
  template:
    metadata:
      labels:
        app: rivulet-relay
    spec:
      containers:
        - name: relay
          image: rivulet-relay:0.4.1
          ports:
            - containerPort: 8080
