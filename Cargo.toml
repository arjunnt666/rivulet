[workspace]
resolver = "2"
members = [
    "crates/rivulet-core",
    "crates/rivulet-crdt",
    "crates/rivulet-sync",
    "crates/rivulet-storage",
    "crates/rivulet-presence",
    "crates/rivulet-query",
    "crates/rivulet-crypto",
    "crates/rivulet-relay",
    "crates/rivulet-cli",
]
default-members = ["crates/rivulet-cli"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/arjunnt666/rivulet"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
